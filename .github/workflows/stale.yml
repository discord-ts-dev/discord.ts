name: Stale
on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: 'No activity for 30 days. Add info or this closes in 7 days.'
          stale-pr-message: 'No activity for 30 days. Rebase or this closes in 7 days.'
          stale-issue-label: needs-info
          exempt-issue-labels: ready-for-agent,ready-for-human
          exempt-pr-labels: ready-for-agent,ready-for-human
          operations-per-run: 30
