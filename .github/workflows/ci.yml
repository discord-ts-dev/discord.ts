name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/_task.yml
    with:
      run: bun run lint

  typecheck:
    uses: ./.github/workflows/_task.yml
    with:
      run: bun run typecheck

  format:
    uses: ./.github/workflows/_task.yml
    with:
      run: bun run format:check

  test:
    uses: ./.github/workflows/_task.yml
    with:
      run: bun run test

  build:
    needs: [lint, typecheck, format, test]
    uses: ./.github/workflows/_task.yml
    with:
      run: bun run build
      timeout: 15

  changeset-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Changeset status
        # ponytail: native git check, no extra action. Fails when packages change with no changeset.
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD -- packages | grep -q .; then
            if ! git diff --name-only "$base"...HEAD -- '.changeset/*.md' | grep -qv -e README.md; then
              echo "::error::packages/* changed but no changeset added. Run 'bunx changeset'."
              exit 1
            fi
          fi
          echo "changeset check ok"
