name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/_task.yml
    secrets: inherit
    with:
      run: bun run lint

  typecheck:
    uses: ./.github/workflows/_task.yml
    secrets: inherit
    with:
      run: bun run typecheck

  format:
    uses: ./.github/workflows/_task.yml
    secrets: inherit
    with:
      run: bun run format:check

  test:
    uses: ./.github/workflows/_task.yml
    secrets: inherit
    with:
      run: bun run test

  redis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Redis integration suite
        run: bun test --preload=./scripts/test-preload.ts packages/redis/tests/integration.test.ts
        env:
          REDIS_URL: redis://127.0.0.1:6379

  scripts:
    uses: ./.github/workflows/_task.yml
    secrets: inherit
    with:
      run: bun run scripts:check

  build:
    needs: [lint, typecheck, format, test, redis]
    uses: ./.github/workflows/_task.yml
    secrets: inherit
    with:
      run: bun run build
      timeout: 15

  changeset-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # ponytail: bots can't write changesets; their bumps ship with the next release.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Changeset status
        run: bash scripts/github/check-changeset.sh "origin/${{ github.base_ref }}"
