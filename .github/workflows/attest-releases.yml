name: Attest releases
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  attest:
    if: github.repository_owner == 'discord-ts-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # gh release upload
      contents: write
      # cosign keyless: identity token for Fulcio, no key material involved
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Attest published tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/github/attest-release.sh "${{ github.event.release.tag_name }}"