name: Attest releases
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  attest:
    if: github.repository_owner == 'discord-ts-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # gh release upload
      contents: write
      # cosign keyless: identity token for Fulcio, no key material involved
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Attest published tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/github/attest-release.sh "${{ github.event.release.tag_name }}"