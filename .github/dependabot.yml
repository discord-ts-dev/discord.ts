# Dependabot — org baseline (rules/dependabot.md) + 7-day cooldown.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels: [dependencies, automated]
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      # codeql sub-actions (init/analyze/upload-sarif) must bump together;
      # split PRs break analysis with a version-skew error.
      codeql:
        patterns: ['github/codeql-action*']
    labels: [dependencies, automated]
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5

  # oven/bun image in apps/example/Dockerfile
  - package-ecosystem: docker
    directory: /apps/example
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels: [dependencies, automated]
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5

# NOTE: the packageManager field (bun binary) has no dependabot ecosystem.
# Bump bun by hand to match the Dockerfile FROM; run `git grep <old-version>`.
